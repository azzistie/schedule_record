name: TimeLedger
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  TimeLedger:
    type: application
    platform: iOS
    sources: [TimeLedger]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.TimeLedger
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 时间账本
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: 读取即将到来的安排，并将你创建的待办写入系统日历。
  TimeLedgerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TimeLedgerTests]
    dependencies:
      - target: TimeLedger
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TimeLedger:
    build:
      targets:
        TimeLedger: all
        TimeLedgerTests: [test]
    test:
      targets: [TimeLedgerTests]
